name: Build, test, and security gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install with lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Static export (what ships in the iOS bundle)
        run: npm run build
      - name: Ensure no remote-code or server leftovers in the bundle
        run: |
          ! grep -rl "vercel.app\|api.anthropic\|ai-gateway" out/_next || (echo "Unexpected remote origin in bundle" && exit 1)
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OSV scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=package-lock.json
      - name: Semgrep OWASP
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
